plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// version.properties хранит последнюю успешно созданную публикационную версию.
// Чтение файла не меняет счётчик при Sync, Run, clean, тестах или assembleRelease.
def versionFile = rootProject.file('version.properties')
def versionState = new Properties()
if (!versionFile.isFile()) throw new GradleException("Не найден ${versionFile}")
versionFile.withInputStream { versionState.load(it) }
def storedVersionCodeText = versionState.getProperty('VERSION_CODE', '').trim()
def versionNamePrefix = versionState.getProperty('VERSION_NAME_PREFIX', '').trim()
if (!(storedVersionCodeText ==~ /[1-9]\d*/)) throw new GradleException('VERSION_CODE должен быть положительным Integer')
if (!(versionNamePrefix ==~ /\d+\.\d+/)) throw new GradleException('VERSION_NAME_PREFIX должен иметь формат X.Y')
def storedVersionCode = storedVersionCodeText.toInteger()
def storedVersionName = "${versionNamePrefix}.${storedVersionCode}"

android {
    namespace 'com.example.calltrack'
    compileSdk 35

    defaultConfig {
        def releaseVersionCode = (project.findProperty("calltrackVersionCode")
                ?: System.getenv("CALLTRACK_VERSION_CODE")
                ?: storedVersionCode).toString().toInteger()
        def releaseVersionName = (project.findProperty("calltrackVersionName")
                ?: System.getenv("CALLTRACK_VERSION_NAME")
                ?: storedVersionName).toString()
        applicationId "com.example.calltrack"
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SQL_API_BASE_URL", '"https://kvasmix.ru/vr/calltrack/api/"'
        buildConfigField "String", "APP_RELEASE_DATE", '"2026-04-22"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "calltrack_v${variant.versionName}_${variant.versionCode}.apk"
        }
    }
}

tasks.register('publishReleaseApk', Exec) {
    group = 'publishing'
    description = 'Последовательно увеличивает версию, собирает и проверяет release APK, затем фиксирует счётчик.'
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/publish_android_apk.sh').absolutePath
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
