plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// Unix-время в минутах компактно помещается в Android versionCode и возрастает
// между сборками, выполненными в разные минуты. Для всех вариантов одной сборки
// значение вычисляется один раз, на этапе конфигурации Gradle.
def generatedVersionCode = (System.currentTimeMillis() / 60000L).toInteger()
if (generatedVersionCode <= 0) throw new GradleException('Сгенерированный versionCode должен быть положительным Integer')

// Release-сборки всегда должны подписываться одним и тем же ключом. Секреты
// хранятся только в локальном keystore.properties и не попадают в Git.
def releaseSigningFile = rootProject.file('keystore.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseSigning = releaseSigningKeys.every { releaseSigning.getProperty(it, '').trim() }

android {
    namespace 'com.example.calltrack'
    compileSdk 35

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
                // Старые прошивки Samsung иногда показывают только общее
                // «Приложение не установлено», если APK не содержит подходящей
                // для их Package Installer схемы подписи. Оставляем современную
                // APK Signature Scheme v2 и совместимую JAR-подпись v1.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    defaultConfig {
        applicationId "com.example.calltrack"
        minSdk 26
        targetSdk 35
        versionCode generatedVersionCode
        versionName "1.0.15"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SQL_API_BASE_URL", '"https://kvasmix.ru/vr/calltrack/api/"'
        buildConfigField "String", "APP_RELEASE_DATE", '"2026-04-22"'
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "calltrack_v${variant.versionName}_${variant.versionCode}.apk"
        }
    }
}

// Не даём случайно опубликовать неподписанный или подписанный временным ключом
// APK. Gradle Sync и debug/Run при этом не требуют release-секретов.
def requestsReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}
if (requestsReleaseBuild && !hasReleaseSigning) {
    throw new GradleException('Для release APK настройте keystore.properties по образцу keystore.properties.example и укажите ключ, которым подписано установленное приложение.')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
